<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B5C6B">
<title>Mi tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #F2F5F4;
    --superficie: #FFFFFF;
    --texto: #12222B;
    --apagado: #46565F;
    --acento: #0B5C6B;
    --acento-oscuro: #08444F;
    --borde: #B9C6CC;
    --error: #A61B1B;
    --ok: #17663F;
  }

  * { box-sizing: border-box; }

  html { font-size: 20px; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.4;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1rem 10rem;
  }

  [hidden] { display: none !important; }

  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.2rem; margin: 0 0 0.75rem; }

  .encabezado {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 0 1rem;
  }

  .panel {
    background: var(--superficie);
    border: 2px solid var(--borde);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-weight: 700;
    margin: 0 0 0.25rem;
  }

  input, select {
    width: 100%;
    min-height: 3rem;
    font: inherit;
    color: var(--texto);
    background: #fff;
    border: 2px solid var(--borde);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.9rem;
  }

  .fila { display: flex; gap: 0.75rem; }
  .fila > div { flex: 1; min-width: 0; }

  button {
    font: inherit;
    font-weight: 700;
    min-height: 3.25rem;
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    border: 2px solid var(--acento);
    background: var(--acento);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--acento-oscuro); }
  button.grande { width: 100%; }
  button.secundario { background: #fff; color: var(--acento); }
  button.secundario:hover { background: #E6EFF1; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  :focus-visible {
    outline: 4px solid #F2B705;
    outline-offset: 2px;
  }

  .mensaje { min-height: 1.5rem; margin: 0.75rem 0 0; font-weight: 700; }
  .mensaje.error { color: var(--error); }
  .mensaje.ok { color: var(--ok); }

  .lista { list-style: none; margin: 0; padding: 0; }

  .producto {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem 0;
    border-top: 2px solid var(--borde);
  }
  .producto:first-child { border-top: 0; }
  .producto .nombre { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
  .producto .detalle { color: var(--apagado); }
  .producto .precio { font-weight: 700; font-size: 1.2rem; white-space: nowrap; }

  .vacio { color: var(--apagado); padding: 0.5rem 0; }

  /* Controles de cantidad en la pantalla de vender */
  .cantidad { display: flex; align-items: center; gap: 0.5rem; }
  .cantidad .num { min-width: 2rem; text-align: center; font-weight: 700; font-size: 1.3rem; }
  .cantidad button.paso { min-width: 3.25rem; padding: 0.5rem; font-size: 1.4rem; }
  .agotado { color: var(--error); font-weight: 700; }

  /* Clientes */
  .cliente { padding: 0.9rem 0; border-top: 2px solid var(--borde); }
  .cliente:first-child { border-top: 0; }
  .cliente .fila-cliente {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .cliente .nombre { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
  .cliente .detalle { color: var(--apagado); }
  .cliente .saldo { font-weight: 700; font-size: 1.2rem; white-space: nowrap; text-align: right; margin-bottom: 0.4rem; }
  .cliente .saldo.debe { color: var(--error); }
  .cliente .saldo.limpio { color: var(--ok); margin-bottom: 0; }
  .derecha-cliente { display: flex; flex-direction: column; align-items: flex-end; }
  .abono-form {
    margin-top: 0.9rem;
    padding: 1rem;
    background: var(--fondo);
    border-radius: 8px;
  }
  .abono-form .fila { margin-top: 0.25rem; }
  .total-cobrar { font-weight: 700; font-size: 1.2rem; margin: 0 0 1rem; }

  /* Barra de abajo: cobrar y navegación */
  #pie {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    border-top: 2px solid var(--borde);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .pie-interior {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1rem;
  }
  #barra-cobro { background: var(--acento); color: #fff; }
  #barra-cobro .pie-interior { justify-content: space-between; }
  #cobro-total { font-weight: 700; font-size: 1.5rem; line-height: 1.2; }
  #barra-cobro button { background: #fff; color: var(--acento); border-color: #fff; min-width: 8rem; }
  #barra-cobro button:hover { background: #E6EFF1; }
  nav .pie-interior, nav.pie-interior { gap: 0.5rem; }
  nav button { flex: 1; padding: 0.5rem 0.25rem; font-size: 0.9rem; }
  nav button.activo { background: var(--acento); color: #fff; }
</style>
</head>
<body>
<main>

  <!-- PANTALLA 1: entrar -->
  <section id="vista-login" hidden>
    <div class="encabezado"><h1>Mi tienda</h1></div>
    <form id="form-login" class="panel">
      <h2>Entrar</h2>
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required>
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <button class="grande" type="submit" id="btn-entrar">Entrar</button>
      <p id="msg-login" class="mensaje" role="status"></p>
    </form>
  </section>

  <!-- PANTALLA 2: vender -->
  <section id="vista-vender" hidden>
    <div class="encabezado">
      <h1>Vender</h1>
      <button class="secundario js-salir" type="button">Salir</button>
    </div>
    <p id="msg-venta" class="mensaje" role="status"></p>

    <div class="panel">
      <h2>¿Cómo paga?</h2>
      <div class="fila">
        <button type="button" id="pago-contado" aria-pressed="true">Contado</button>
        <button type="button" id="pago-credito" class="secundario" aria-pressed="false">A crédito</button>
      </div>
      <div id="bloque-cliente" hidden style="margin-top: 0.9rem;">
        <label for="sel-cliente">Cliente</label>
        <select id="sel-cliente"></select>
        <p id="sin-clientes" class="vacio" hidden>Aún no tienes clientes. Agrégalos en la pestaña Clientes.</p>
      </div>
    </div>

    <div class="panel">
      <label for="buscar-venta">Buscar producto</label>
      <input id="buscar-venta" type="search" autocomplete="off">
      <ul id="lista-venta" class="lista"></ul>
    </div>
  </section>

  <!-- PANTALLA 3: clientes -->
  <section id="vista-clientes" hidden>
    <div class="encabezado">
      <h1>Clientes</h1>
      <button class="secundario js-salir" type="button">Salir</button>
    </div>
    <p id="msg-clientes" class="mensaje" role="status"></p>

    <form id="form-cliente" class="panel">
      <h2>Agregar cliente</h2>
      <label for="cliente-nombre">Nombre</label>
      <input id="cliente-nombre" type="text" autocomplete="off" required>
      <label for="cliente-telefono">Teléfono (opcional)</label>
      <input id="cliente-telefono" type="tel" inputmode="tel" autocomplete="off">
      <button class="grande" type="submit" id="btn-cliente">Guardar cliente</button>
    </form>

    <div class="panel">
      <p class="total-cobrar" id="total-por-cobrar"></p>
      <label for="buscar-cliente">Buscar cliente</label>
      <input id="buscar-cliente" type="search" autocomplete="off">
      <ul id="lista-clientes" class="lista"></ul>
    </div>
  </section>

  <section id="vista-productos" hidden>
    <div cla
