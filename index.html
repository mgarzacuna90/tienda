<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B5C6B">
<title>Mi tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #F2F5F4;
    --superficie: #FFFFFF;
    --texto: #12222B;
    --apagado: #46565F;
    --acento: #0B5C6B;
    --acento-oscuro: #08444F;
    --borde: #B9C6CC;
    --error: #A61B1B;
    --ok: #17663F;
  }

  * { box-sizing: border-box; }

  html { font-size: 20px; }

  body {
    margin: 0;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.4;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 1rem 1rem 10rem;
  }

  [hidden] { display: none !important; }

  h1 { font-size: 1.6rem; margin: 0; }
  h2 { font-size: 1.2rem; margin: 0 0 0.75rem; }

  .encabezado {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 0 1rem;
  }

  .panel {
    background: var(--superficie);
    border: 2px solid var(--borde);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1.25rem;
  }

  label {
    display: block;
    font-weight: 700;
    margin: 0 0 0.25rem;
  }

  input, select {
    width: 100%;
    min-height: 3rem;
    font: inherit;
    color: var(--texto);
    background: #fff;
    border: 2px solid var(--borde);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    margin-bottom: 0.9rem;
  }

  .fila { display: flex; gap: 0.75rem; }
  .fila > div { flex: 1; min-width: 0; }

  button {
    font: inherit;
    font-weight: 700;
    min-height: 3.25rem;
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    border: 2px solid var(--acento);
    background: var(--acento);
    color: #fff;
    cursor: pointer;
  }
  button:hover { background: var(--acento-oscuro); }
  button.grande { width: 100%; }
  button.secundario { background: #fff; color: var(--acento); }
  button.secundario:hover { background: #E6EFF1; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }

  :focus-visible {
    outline: 4px solid #F2B705;
    outline-offset: 2px;
  }

  .mensaje { min-height: 1.5rem; margin: 0.75rem 0 0; font-weight: 700; }
  .mensaje.error { color: var(--error); }
  .mensaje.ok { color: var(--ok); }

  .lista { list-style: none; margin: 0; padding: 0; }

  .producto {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem 0;
    border-top: 2px solid var(--borde);
  }
  .producto:first-child { border-top: 0; }
  .producto .nombre { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
  .producto .detalle { color: var(--apagado); }
  .producto .precio { font-weight: 700; font-size: 1.2rem; white-space: nowrap; }

  .vacio { color: var(--apagado); padding: 0.5rem 0; }

  /* Controles de cantidad en la pantalla de vender */
  .cantidad { display: flex; align-items: center; gap: 0.5rem; }
  .cantidad .num { min-width: 2rem; text-align: center; font-weight: 700; font-size: 1.3rem; }
  .cantidad button.paso { min-width: 3.25rem; padding: 0.5rem; font-size: 1.4rem; }
  .agotado { color: var(--error); font-weight: 700; }

  /* Clientes */
  .cliente { padding: 0.9rem 0; border-top: 2px solid var(--borde); }
  .cliente:first-child { border-top: 0; }
  .cliente .fila-cliente {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .cliente .nombre { font-weight: 700; font-size: 1.1rem; overflow-wrap: anywhere; }
  .cliente .detalle { color: var(--apagado); }
  .cliente .saldo { font-weight: 700; font-size: 1.2rem; white-space: nowrap; text-align: right; margin-bottom: 0.4rem; }
  .cliente .saldo.debe { color: var(--error); }
  .cliente .saldo.limpio { color: var(--ok); margin-bottom: 0; }
  .derecha-cliente { display: flex; flex-direction: column; align-items: flex-end; }
  .abono-form {
    margin-top: 0.9rem;
    padding: 1rem;
    background: var(--fondo);
    border-radius: 8px;
  }
  .abono-form .fila { margin-top: 0.25rem; }
  .total-cobrar { font-weight: 700; font-size: 1.2rem; margin: 0 0 1rem; }

  /* Barra de abajo: cobrar y navegación */
  #pie {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    border-top: 2px solid var(--borde);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .pie-interior {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1rem;
  }
  #barra-cobro { background: var(--acento); color: #fff; }
  #barra-cobro .pie-interior { justify-content: space-between; }
  #cobro-total { font-weight: 700; font-size: 1.5rem; line-height: 1.2; }
  #barra-cobro button { background: #fff; color: var(--acento); border-color: #fff; min-width: 8rem; }
  #barra-cobro button:hover { background: #E6EFF1; }
  nav .pie-interior, nav.pie-interior { gap: 0.5rem; }
  nav button { flex: 1; padding: 0.5rem 0.25rem; font-size: 0.9rem; }
  nav button.activo { background: var(--acento); color: #fff; }
</style>
</head>
<body>
<main>

  <!-- PANTALLA 1: entrar -->
  <section id="vista-login" hidden>
    <div class="encabezado"><h1>Mi tienda</h1></div>
    <form id="form-login" class="panel">
      <h2>Entrar</h2>
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" required>
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
      <button class="grande" type="submit" id="btn-entrar">Entrar</button>
      <p id="msg-login" class="mensaje" role="status"></p>
    </form>
  </section>

  <!-- PANTALLA 2: vender -->
  <section id="vista-vender" hidden>
    <div class="encabezado">
      <h1>Vender</h1>
      <button class="secundario js-salir" type="button">Salir</button>
    </div>
    <p id="msg-venta" class="mensaje" role="status"></p>

    <div class="panel">
      <h2>¿Cómo paga?</h2>
      <div class="fila">
        <button type="button" id="pago-contado" aria-pressed="true">Contado</button>
        <button type="button" id="pago-credito" class="secundario" aria-pressed="false">A crédito</button>
      </div>
      <div id="bloque-cliente" hidden style="margin-top: 0.9rem;">
        <label for="sel-cliente">Cliente</label>
        <select id="sel-cliente"></select>
        <p id="sin-clientes" class="vacio" hidden>Aún no tienes clientes. Agrégalos en la pestaña Clientes.</p>
      </div>
    </div>

    <div class="panel">
      <label for="buscar-venta">Buscar producto</label>
      <input id="buscar-venta" type="search" autocomplete="off">
      <ul id="lista-venta" class="lista"></ul>
    </div>
  </section>

  <!-- PANTALLA 3: clientes -->
  <section id="vista-clientes" hidden>
    <div class="encabezado">
      <h1>Clientes</h1>
      <button class="secundario js-salir" type="button">Salir</button>
    </div>
    <p id="msg-clientes" class="mensaje" role="status"></p>

    <form id="form-cliente" class="panel">
      <h2>Agregar cliente</h2>
      <label for="cliente-nombre">Nombre</label>
      <input id="cliente-nombre" type="text" autocomplete="off" required>
      <label for="cliente-telefono">Teléfono (opcional)</label>
      <input id="cliente-telefono" type="tel" inputmode="tel" autocomplete="off">
      <button class="grande" type="submit" id="btn-cliente">Guardar cliente</button>
    </form>

    <div class="panel">
      <p class="total-cobrar" id="total-por-cobrar"></p>
      <label for="buscar-cliente">Buscar cliente</label>
      <input id="buscar-cliente" type="search" autocomplete="off">
      <ul id="lista-clientes" class="lista"></ul>
    </div>
  </section>

  <!-- PANTALLA 4: productos -->
  <section id="vista-productos" hidden>
    <div class="encabezado">
      <h1>Productos</h1>
      <button class="secundario js-salir" type="button">Salir</button>
    </div>

    <form id="form-agregar" class="panel">
      <h2>Agregar producto</h2>
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" autocomplete="off" required>
      <div class="fila">
        <div>
          <label for="precio">Precio</label>
          <input id="precio" type="number" inputmode="decimal" min="0" step="any" required>
        </div>
        <div>
          <label for="cantidad">Cantidad</label>
          <input id="cantidad" type="number" inputmode="numeric" min="0" step="1" required>
        </div>
      </div>
      <button class="grande" type="submit" id="btn-guardar">Guardar producto</button>
      <p id="msg-agregar" class="mensaje" role="status"></p>
    </form>

    <div class="panel">
      <label for="buscar">Buscar producto</label>
      <input id="buscar" type="search" autocomplete="off">
      <ul id="lista" class="lista"></ul>
      <p id="msg-lista" class="mensaje" role="status"></p>
    </div>
  </section>

</main>

<!-- Barra de abajo -->
<div id="pie" hidden>
  <div id="barra-cobro" hidden>
    <div class="pie-interior">
      <div>
        <div id="cobro-detalle"></div>
        <div id="cobro-total"></div>
      </div>
      <button type="button" id="btn-cobrar">Cobrar</button>
    </div>
  </div>
  <nav class="pie-interior">
    <button type="button" id="nav-vender" class="secundario">Vender</button>
    <button type="button" id="nav-clientes" class="secundario">Clientes</button>
    <button type="button" id="nav-productos" class="secundario">Productos</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ---------- 1. Conexión con tu base de datos ----------
  // Estos dos datos son públicos; la seguridad la dan los permisos que ya configuraste.
  const SUPABASE_URL = "https://vyrpnkbvurbueugpuwak.supabase.co";
  const SUPABASE_KEY = "sb_publishable_zMYMbcXO528BkfF1DEKwKw_S5DmUrRf";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---------- 2. Elementos y datos de la página ----------
  const $ = (id) => document.getElementById(id);
  const vistaLogin = $("vista-login");
  const vistas = {
    vender: $("vista-vender"),
    clientes: $("vista-clientes"),
    productos: $("vista-productos"),
  };

  let productos = [];         // la lista que viene de la base de datos
  let clientes = [];          // clientes con lo que deben
  let carrito = {};           // la venta en curso: { idProducto: cantidad }
  let aCredito = false;       // ¿la venta en curso es a crédito?
  let abonandoId = null;      // cliente al que se le está capturando un abono
  let vistaActual = "vender"; // pantalla que se está viendo

  const dinero = new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" });
  const redondear = (n) => Math.round(Number(n) * 100) / 100;

  // ---------- 3. Mostrar una pantalla u otra ----------
  function mostrar(sesionActiva) {
    vistaLogin.hidden = sesionActiva;
    $("pie").hidden = !sesionActiva;

    if (sesionActiva) {
      irA(vistaActual);
      cargarProductos();
      cargarClientes();
    } else {
      for (const nombre in vistas) vistas[nombre].hidden = true;
      carrito = {};
      abonandoId = null;
    }
  }

  function irA(nombre) {
    vistaActual = nombre;
    for (const clave in vistas) {
      vistas[clave].hidden = clave !== nombre;
      $("nav-" + clave).classList.toggle("activo", clave === nombre);
    }
    actualizarCobro();
    window.scrollTo(0, 0);
  }

  $("nav-vender").addEventListener("click", () => irA("vender"));
  $("nav-clientes").addEventListener("click", () => irA("clientes"));
  $("nav-productos").addEventListener("click", () => irA("productos"));

  function aviso(idElemento, texto, tipo) {
    const el = $(idElemento);
    el.textContent = texto || "";
    el.className = "mensaje" + (tipo ? " " + tipo : "");
  }

  // ---------- 4. Entrar y salir ----------
  $("form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const boton = $("btn-entrar");
    boton.disabled = true;
    aviso("msg-login", "");

    const { error } = await db.auth.signInWithPassword({
      email: $("correo").value.trim(),
      password: $("clave").value,
    });

    boton.disabled = false;
    if (error) {
      aviso("msg-login", "Correo o contraseña incorrectos. Revísalos e intenta otra vez.", "error");
    }
    // Si todo sale bien, onAuthStateChange (abajo) cambia la pantalla solo.
  });

  document.querySelectorAll(".js-salir").forEach((boton) => {
    boton.addEventListener("click", async () => {
      await db.auth.signOut();
    });
  });

  db.auth.onAuthStateChange((_evento, sesion) => {
    // setTimeout evita que Supabase se trabe al hacer otras consultas aquí dentro.
    setTimeout(() => mostrar(Boolean(sesion)), 0);
  });

  // ---------- 5. Leer productos ----------
  async function cargarProductos() {
    const { data, error } = await db
      .from("productos")
      .select("id, nombre, precio, cantidad")
      .order("nombre", { ascending: true });

    if (error) {
      aviso("msg-lista", "No se pudo cargar la lista. Revisa tu internet e intenta otra vez.", "error");
      return;
    }
    aviso("msg-lista", "");
    productos = data;

    // Si el inventario cambió, ajustamos la venta en curso para no pasarnos.
    for (const id of Object.keys(carrito)) {
      const p = productos.find((x) => String(x.id) === id);
      if (!p || p.cantidad <= 0) {
        delete carrito[id];
      } else if (carrito[id] > p.cantidad) {
        carrito[id] = p.cantidad;
      }
    }

    pintarLista();
    pintarVender();
    actualizarCobro();
  }

  // Lista de la pantalla "Productos"
  function pintarLista() {
    const texto = $("buscar").value.trim().toLowerCase();
    const visibles = productos.filter((p) => p.nombre.toLowerCase().includes(texto));
    const lista = $("lista");
    lista.replaceChildren();

    if (visibles.length === 0) {
      const vacio = document.createElement("li");
      vacio.className = "vacio";
      vacio.textContent = productos.length === 0
        ? "Aún no hay productos. Agrega el primero arriba."
        : "No hay productos con ese nombre.";
      lista.appendChild(vacio);
      return;
    }

    for (const p of visibles) {
      const li = document.createElement("li");
      li.className = "producto";

      const izquierda = document.createElement("div");
      const nombre = document.createElement("div");
      nombre.className = "nombre";
      nombre.textContent = p.nombre;
      const detalle = document.createElement("div");
      detalle.className = "detalle";
      detalle.textContent = "Quedan " + p.cantidad;
      izquierda.append(nombre, detalle);

      const precio = document.createElement("div");
      precio.className = "precio";
      precio.textContent = dinero.format(p.precio);

      li.append(izquierda, precio);
      lista.appendChild(li);
    }
  }

  $("buscar").addEventListener("input", pintarLista);

  // ---------- 6. Agregar un producto ----------
  $("form-agregar").addEventListener("submit", async (e) => {
    e.preventDefault();
    const boton = $("btn-guardar");
    boton.disabled = true;
    aviso("msg-agregar", "");

    const { error } = await db.from("productos").insert({
      nombre: $("nombre").value.trim(),
      precio: Number($("precio").value),
      cantidad: parseInt($("cantidad").value, 10),
    });

    boton.disabled = false;
    if (error) {
      aviso("msg-agregar", "No se pudo guardar el producto. Intenta otra vez.", "error");
      return;
    }

    $("form-agregar").reset();
    aviso("msg-agregar", "Producto guardado ✓", "ok");
    $("nombre").focus();
    cargarProductos();
  });

  // ---------- 7. Pantalla de vender ----------
  function cambiarCantidad(id, cambio, maximo) {
    const nueva = (carrito[id] || 0) + cambio;
    if (nueva <= 0) {
      delete carrito[id];
    } else {
      carrito[id] = Math.min(nueva, maximo);
    }
    aviso("msg-venta", "");
    pintarVender();
    actualizarCobro();
  }

  function pintarVender() {
    const texto = $("buscar-venta").value.trim().toLowerCase();
    const visibles = productos.filter((p) => p.nombre.toLowerCase().includes(texto));
    const lista = $("lista-venta");
    lista.replaceChildren();

    if (visibles.length === 0) {
      const vacio = document.createElement("li");
      vacio.className = "vacio";
      vacio.textContent = productos.length === 0
        ? "Aún no hay productos. Agrégalos en la pestaña Productos."
        : "No hay productos con ese nombre.";
      lista.appendChild(vacio);
      return;
    }

    for (const p of visibles) {
      const li = document.createElement("li");
      li.className = "producto";

      const izquierda = document.createElement("div");
      const nombre = document.createElement("div");
      nombre.className = "nombre";
      nombre.textContent = p.nombre;
      const detalle = document.createElement("div");
      detalle.className = "detalle";
      detalle.textContent = dinero.format(p.precio) + " · Quedan " + p.cantidad;
      izquierda.append(nombre, detalle);

      const derecha = document.createElement("div");
      const enCarrito = carrito[p.id] || 0;

      if (p.cantidad <= 0) {
        derecha.className = "agotado";
        derecha.textContent = "Agotado";
      } else if (enCarrito === 0) {
        const agregar = document.createElement("button");
        agregar.type = "button";
        agregar.textContent = "Agregar";
        agregar.addEventListener("click", () => cambiarCantidad(p.id, 1, p.cantidad));
        derecha.appendChild(agregar);
      } else {
        derecha.className = "cantidad";

        const menos = document.createElement("button");
        menos.type = "button";
        menos.className = "paso secundario";
        menos.textContent = "−";
        menos.setAttribute("aria-label", "Quitar uno de " + p.nombre);
        menos.addEventListener("click", () => cambiarCantidad(p.id, -1, p.cantidad));

        const num = document.createElement("span");
        num.className = "num";
        num.textContent = enCarrito;

        const mas = document.createElement("button");
        mas.type = "button";
        mas.className = "paso";
        mas.textContent = "+";
        mas.setAttribute("aria-label", "Agregar uno de " + p.nombre);
        mas.disabled = enCarrito >= p.cantidad;
        mas.addEventListener("click", () => cambiarCantidad(p.id, 1, p.cantidad));

        derecha.append(menos, num, mas);
      }

      li.append(izquierda, derecha);
      lista.appendChild(li);
    }
  }

  $("buscar-venta").addEventListener("input", pintarVender);

  // Contado o a crédito
  function ponerTipoDePago(credito) {
    aCredito = credito;
    $("pago-contado").classList.toggle("secundario", credito);
    $("pago-credito").classList.toggle("secundario", !credito);
    $("pago-contado").setAttribute("aria-pressed", String(!credito));
    $("pago-credito").setAttribute("aria-pressed", String(credito));
    $("bloque-cliente").hidden = !credito;
    aviso("msg-venta", "");
    actualizarCobro();
  }

  $("pago-contado").addEventListener("click", () => ponerTipoDePago(false));
  $("pago-credito").addEventListener("click", () => ponerTipoDePago(true));

  function llenarSelectClientes() {
    const sel = $("sel-cliente");
    const actual = sel.value;
    sel.replaceChildren();

    const base = document.createElement("option");
    base.value = "";
    base.textContent = "Elige un cliente";
    sel.appendChild(base);

    for (const c of clientes) {
      const opcion = document.createElement("option");
      opcion.value = String(c.id);
      opcion.textContent = c.nombre + (c.saldo > 0 ? " (debe " + dinero.format(c.saldo) + ")" : "");
      sel.appendChild(opcion);
    }

    sel.value = actual;
    $("sin-clientes").hidden = clientes.length > 0;
  }

  function calcularCarrito() {
    let total = 0;
    let cantidadTotal = 0;
    const items = [];
    for (const p of productos) {
      const q = carrito[p.id];
      if (q > 0) {
        total += p.precio * q;
        cantidadTotal += q;
        items.push({ producto_id: p.id, cantidad: q });
      }
    }
    return { total: redondear(total), cantidadTotal, items };
  }

  function actualizarCobro() {
    const { total, cantidadTotal } = calcularCarrito();
    $("barra-cobro").hidden = !(cantidadTotal > 0 && vistaActual === "vender");
    $("cobro-detalle").textContent =
      cantidadTotal + (cantidadTotal === 1 ? " artículo" : " artículos") + (aCredito ? " · A crédito" : "");
    $("cobro-total").textContent = dinero.format(total);
  }
    // ---------- 8. Cobrar ----------
  $("btn-cobrar").addEventListener("click", async () => {
    const { total, items } = calcularCarrito();
    if (items.length === 0) return;

    const clienteId = $("sel-cliente").value ? Number($("sel-cliente").value) : null;
    if (aCredito && !clienteId) {
      aviso("msg-venta", "Elige un cliente para vender a crédito.", "error");
      window.scrollTo(0, 0);
      return;
    }

    const cliente = clientes.find((c) => c.id === clienteId);
    const pregunta = aCredito
      ? "¿Cobrar " + dinero.format(total) + " a crédito a " + cliente.nombre + "?"
      : "¿Cobrar " + dinero.format(total) + "?";
    if (!window.confirm(pregunta)) return;

    const boton = $("btn-cobrar");
    boton.disabled = true;
    aviso("msg-venta", "");

    // Esta función de Supabase guarda la venta y descuenta el inventario en un solo paso.
    const { error } = await db.rpc("registrar_venta", {
      items,
      p_cliente_id: aCredito ? clienteId : null,
      p_a_credito: aCredito,
    });
    boton.disabled = false;

    if (error) {
      const conocido = /inventario|no encontrado|cliente/i.test(error.message || "");
      aviso(
        "msg-venta",
        conocido
          ? error.message + ". Revisa la venta e intenta otra vez."
          : "No se pudo registrar la venta. Revisa tu internet e intenta otra vez.",
        "error"
      );
      await cargarProductos();
      window.scrollTo(0, 0);
      return;
    }

    carrito = {};
    $("buscar-venta").value = "";
    const detalleCredito = aCredito ? " (a crédito a " + cliente.nombre + ")" : "";
    $("sel-cliente").value = "";
    ponerTipoDePago(false);
    aviso("msg-venta", "Venta guardada ✓ Total: " + dinero.format(total) + detalleCredito, "ok");
    await Promise.all([cargarProductos(), cargarClientes()]);
    window.scrollTo(0, 0);
  });

  // ---------- 9. Clientes y abonos ----------
  async function cargarClientes() {
    const { data, error } = await db
      .from("saldo_clientes")
      .select("id, nombre, telefono, saldo")
      .order("nombre", { ascending: true });

    if (error) {
      aviso("msg-clientes", "No se pudo cargar la lista de clientes. Revisa tu internet e intenta otra vez.", "error");
      return;
    }
    clientes = data.map((c) => ({ ...c, saldo: redondear(c.saldo) }));
    pintarClientes();
    llenarSelectClientes();
  }

  function pintarClientes() {
    const texto = $("buscar-cliente").value.trim().toLowerCase();
    const visibles = clientes.filter((c) => c.nombre.toLowerCase().includes(texto));
    const lista = $("lista-clientes");
    lista.replaceChildren();

    const porCobrar = redondear(clientes.reduce((suma, c) => suma + (c.saldo > 0 ? c.saldo : 0), 0));
    $("total-por-cobrar").textContent = "Total por cobrar: " + dinero.format(porCobrar);

    if (visibles.length === 0) {
      const vacio = document.createElement("li");
      vacio.className = "vacio";
      vacio.textContent = clientes.length === 0
        ? "Aún no hay clientes. Agrega el primero arriba."
        : "No hay clientes con ese nombre.";
      lista.appendChild(vacio);
      return;
    }

    for (const c of visibles) {
      const li = document.createElement("li");
      li.className = "cliente";

      const fila = document.createElement("div");
      fila.className = "fila-cliente";

      const izquierda = document.createElement("div");
      const nombre = document.createElement("div");
      nombre.className = "nombre";
      nombre.textContent = c.nombre;
      const detalle = document.createElement("div");
      detalle.className = "detalle";
      detalle.textContent = c.telefono || "Sin teléfono";
      izquierda.append(nombre, detalle);

      const derecha = document.createElement("div");
      derecha.className = "derecha-cliente";
      const saldo = document.createElement("div");
      saldo.className = "saldo " + (c.saldo > 0 ? "debe" : "limpio");
      saldo.textContent = c.saldo > 0 ? "Debe " + dinero.format(c.saldo) : "Sin deuda";
      derecha.appendChild(saldo);

      if (c.saldo > 0) {
        const abonar = document.createElement("button");
        abonar.type = "button";
        abonar.className = "secundario";
        abonar.textContent = "Abonar";
        abonar.addEventListener("click", () => {
          abonandoId = abonandoId === c.id ? null : c.id;
          aviso("msg-clientes", "");
          pintarClientes();
        });
        derecha.appendChild(abonar);
      }

      fila.append(izquierda, derecha);
      li.appendChild(fila);

      if (abonandoId === c.id && c.saldo > 0) {
        li.appendChild(crearFormularioAbono(c));
      }

      lista.appendChild(li);
    }
  }

  function crearFormularioAbono(c) {
    const form = document.createElement("form");
    form.className = "abono-form";

    const etiqueta = document.createElement("label");
    etiqueta.htmlFor = "monto-abono";
    etiqueta.textContent = "¿Cuánto abona?";

    const campo = document.createElement("input");
    campo.id = "monto-abono";
    campo.type = "number";
    campo.inputMode = "decimal";
    campo.min = "0";
    campo.step = "any";
    campo.required = true;

    const botones = document.createElement("div");
    botones.className = "fila";

    const guardar = document.createElement("button");
    guardar.type = "submit";
    guardar.textContent = "Guardar abono";

    const cancelar = document.createElement("button");
    cancelar.type = "button";
    cancelar.className = "secundario";
    cancelar.textContent = "Cancelar";
    cancelar.addEventListener("click", () => {
      abonandoId = null;
      pintarClientes();
    });

    botones.append(guardar, cancelar);
    form.append(etiqueta, campo, botones);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const monto = redondear(campo.value);

      if (!(monto > 0)) {
        aviso("msg-clientes", "Escribe una cantidad mayor a cero.", "error");
        return;
      }
      if (monto > c.saldo) {
        aviso("msg-clientes", c.nombre + " debe " + dinero.format(c.saldo) + ". El abono no puede ser mayor.", "error");
        return;
      }

      guardar.disabled = true;
      const { error } = await db.from("abonos").insert({ cliente_id: c.id, monto });
      guardar.disabled = false;

      if (error) {
        aviso("msg-clientes", "No se pudo guardar el abono. Intenta otra vez.", "error");
        return;
      }

      const nuevoSaldo = redondear(c.saldo - monto);
      abonandoId = null;
      await cargarClientes();
      aviso(
        "msg-clientes",
        "Abono guardado ✓ " + (nuevoSaldo > 0
          ? c.nombre + " ahora debe " + dinero.format(nuevoSaldo) + "."
          : c.nombre + " ya no debe nada."),
        "ok"
      );
      window.scrollTo(0, 0);
    });

    setTimeout(() => campo.focus(), 0);
    return form;
  }

  $("buscar-cliente").addEventListener("input", pintarClientes);

  $("form-cliente").addEventListener("submit", async (e) => {
    e.preventDefault();
    const boton = $("btn-cliente");
    boton.disabled = true;
    aviso("msg-clientes", "");

    const telefono = $("cliente-telefono").value.trim();
    const { error } = await db.from("clientes").insert({
      nombre: $("cliente-nombre").value.trim(),
      telefono: telefono || null,
    });

    boton.disabled = false;
    if (error) {
      aviso("msg-clientes", "No se pudo guardar el cliente. Intenta otra vez.", "error");
      return;
    }

    $("form-cliente").reset();
    await cargarClientes();
    aviso("msg-clientes", "Cliente guardado ✓", "ok");
  });

  // ---------- 10. Mantener la información al día ----------
  // Cuando vuelves a abrir la app, se recarga todo para ver lo que hizo la otra persona.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !$("pie").hidden) {
      cargarProductos();
      cargarClientes();
    }
  });

  // ---------- 11. Al abrir la página ----------
  db.auth.getSession().then(({ data }) => mostrar(Boolean(data.session)));
</script>
</body>
</html>
